<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#001836;--mute:#6b7280;--line:#d9dbe0;--accent:#07a5ed;--err:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#30363d;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif}
form{width:100%;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
h1{margin:0;font-size:17px}
p{margin:0;color:var(--mute);font-size:13px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--err);min-height:1.2em}
</style>

  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(D)));
  try{sessionStorage.setItem("ld-pw",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),go=document.getElementById("go"),err=document.getElementById("err");
f.addEventListener("submit",async e=>{
  e.preventDefault();go.disabled=true;err.textContent="";
  try{await open(document.getElementById("pw").value)}
  catch(x){err.textContent="That password didn't work.";go.disabled=false}
});
let saved=null;try{saved=sessionStorage.getItem("ld-pw")}catch(e){}
if(saved)open(saved).catch(()=>{try{sessionStorage.removeItem("ld-pw")}catch(e){}});
</script>
