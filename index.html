<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#001836;--mute:#6b7280;--line:#d9dbe0;--accent:#07a5ed;--err:#c0262d}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif}

h1{margin:0;font-size:17px}
p{margin:0;color:var(--mute);font-size:13px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--err);min-height:1.2em}
</style>
