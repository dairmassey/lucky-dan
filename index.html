<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#001836;--mute:#6b7280;--line:#d9dbe0;--accent:#07a5ed;--err:#c0262d}

button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer}

#err{color:var(--err);min-height:1.2em}
</style>

async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

}
const f=document.getElementById("f"),go=document.getElementById("go"),err=document.getElementById("err");
f.addEventListener("submit",async e=>{

  try{await open(document.getElementById("pw").value)}
  catch(x){err.textContent="That password didn't work.";go.disabled=false}

let saved=null;try{saved=sessionStorage.getItem("ld-pw")}catch(e){}
